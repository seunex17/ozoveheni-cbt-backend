<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14212e">
    <title>Server unavailable · Ozoveheni</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #14212e; background: #f4f6f8; }
        .card { width: 100%; max-width: 460px; padding: 32px; border: 1px solid #dce2e7; border-radius: 16px; background: white; }
        .brand { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
        h1 { margin: 24px 0 16px; font-size: 25px; }
        p { color: #596570; line-height: 1.7; font-size: 14px; }
        .btn { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #14212e; color: white; font-size: 14px; font-weight: 600; text-decoration: none; }
        .btn:focus-visible { outline: 3px solid #008579; outline-offset: 4px; }
    </style>
</head>
<body>
    <main class="card">
        <span class="brand">OZOVEHENI</span>
        <h1>The school server is unavailable</h1>
        <p>Connect to the school network and check that the server PC is running, then try again.</p>
        <p>Student records, results and downloads need a connection to the school server.</p>
        <a class="btn" href="/dashboard">Try again</a>
    </main>
</body>
</html>
